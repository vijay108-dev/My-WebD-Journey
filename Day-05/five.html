<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nested Table Example</title>
</head>
<body>

  <table border="3" cellspacing="0" cellpadding="20">
    <thead>
      <tr>
        <th>Table 1</th>
        <th>Table 1</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Table 1</td>

        <!-- Nested Table Start -->
        <td>
          <table border="3" cellspacing="0" cellpadding="15" bordercolor="blue" align="center">
            <thead>
              <tr>
                <th colspan="2">Table 1</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>Table 2</td>
                <td>Table 2</td>
              </tr>
              <tr>
                <td>Table 2</td>
                <td>Table 2</td>
              </tr>
            </tbody>
          </table>
        </td>
        <!-- Nested Table End -->
      </tr>

      <tr>
        <td>Table 1</td>
        <td>Table 1</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
